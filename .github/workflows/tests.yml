# Runs the offline tests on GitHub's servers after every push, on two Python versions.
# The tests use a fake AI, so no API key or other secrets are needed and nothing is spent.
# Results show as a green tick or red cross next to each commit.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:  # adds a "Run workflow" button on GitHub

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.15"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover tests -v
